# Site settings
title: "SPARQL Anything"
description: "Query CSV, JSON, XML, spreadsheets, HTML and other formats with plain SPARQL, using the Façade-X model."
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://sparql-anything.cc" # the base hostname & protocol for your site

github_username: "sparql-anything"

# Current stable release, shown in the header and the getting-started steps.
# Update these three values when a new version is released.
release:
  version: "1.2.0"
  date: "24 July 2026"
  java: "21"

# Current Façade-X specification release (W3C Data Façades CG).
spec:
  version: "0.1"
  url: "https://w3c-facade-x.github.io/facade-x-specs/"

docs: "https://sparql-anything.readthedocs.io/stable/"

# Build settings
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
